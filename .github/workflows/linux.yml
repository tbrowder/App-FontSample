name: Linux

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  raku:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        raku-version:
          - 'latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               libfontconfig1-dev \
               libfreetype6-dev    \
               libharfbuzz-dev
      - name: Install Dependencies
        run: zef install --/test --test-depends --deps-only .
      - name: Test and Install
        run: zef install .
